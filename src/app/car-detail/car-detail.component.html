<div class="car-card">
  <div class="car-image">
    <img [src]="car?.image" alt="{{ car?.make }} {{ car?.model }}">
  </div>

  <div class="car-info">
    <h1>{{ car?.make }} {{ car?.model }}</h1>
    <p>VIN: {{car?.vin}}</p>
    <p>Year: {{ car?.year }}</p>
    <p *ngIf="car?.color">Color: {{ car?.color }}</p>
  </div>
</div>
